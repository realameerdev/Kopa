<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kopa — AI Operating System for African Business</title>
    <meta name="description" content="Kopa turns everyday voice and text messages into structured financial intelligence, automated bookkeeping, and a portable Business Passport for African enterprises." />
    
    <!-- Open Graph / Search Meta Tags (Dark Logo and Branding) -->
    <meta property="og:title" content="Kopa — AI Operating System for African Business" />
    <meta property="og:description" content="Kopa turns everyday voice and text messages into structured financial intelligence, automated bookkeeping, and a portable Business Passport for African enterprises." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo-dark.svg" />
    <meta property="og:image:alt" content="Kopa — Dark Emblem Logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kopa — AI Operating System for African Business" />
    <meta name="twitter:description" content="Kopa turns everyday voice and text messages into structured financial intelligence, automated bookkeeping, and a portable Business Passport for African enterprises." />
    <meta name="twitter:image" content="/logo-dark.svg" />
    
    <!-- Theme & Icons (Dark Badges for Search and Browser Previews) -->
    <meta name="theme-color" content="#08110F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#08110F" />
    
    <!-- Structured Data for Search Engine Verification (Dark Logo Schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kopa",
        "url": "https://kopa.africa",
        "logo": "/favicon.svg",
        "description": "AI Operating System for African Business"
      }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kopa-theme');
          var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
